{% extends 'base.html' %}

{% block content %}

<h2>Cadastro de filme</h2>
<hr>

<form action="{{ url_for('cadfilme') }}" method="POST">
    <label>Título</label>
    <input type="text" name="titulo" placeholder="Insira o título do filme" required class="form-control">

    <label>Ano</label>
    <input type="text" name="ano" placeholder="Insira o ano do filme" required class="form-control">

    <label>Gênero</label>
    <input type="text" name="genero" placeholder="Insira o gênero do filme" required class="form-control">

    <br>
    <input type="submit" value="Cadastrar" class="btn btn-success">
    <input type="reset" value="Limpar" class="btn btn-danger">
</form>

{% endblock content %}
