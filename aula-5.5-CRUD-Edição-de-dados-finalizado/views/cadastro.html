{% extends 'base.html' %}

{% block content %}

<div class="container">
<div class="card mt-4">
        <div class="card-header">
            <h2>Cadastro do usuario</h2>
         </div>
 <div class="card-body">
    <form action="{{url_for('cadastro')}}" method= "POST"> 
        <input type="email" name="email" class="form-control" placeholder="insira seu email" required>
        <br>
        <input type="password" name="senha" class="form-control" placeholder="insira sua senha" required>
      
        <button type="submit" class="btn btn-danger btn-block ">Enviar</button>
    </form>
 </div>
</div>

</div>

{% endblock content %}
